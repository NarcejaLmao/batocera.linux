# GPT layout expected by the RG Rotate SPL / U-Boot:
#   p1 "uboot"  raw, DHTB-wrapped U-Boot, found by the SPL through its GPT name
#   p2 BATOCERA FAT32 holding /extlinux/extlinux.conf + kernel, dtb, initrd, squashfs
#   p3 SHARE    ext4 userdata
image boot.vfat {
    vfat {
        extraargs = "-F 32 -n BATOCERA"
        @files
    }
    size = 8G
}

image userdata.ext4 {
    ext4 {
        label = "SHARE"
        use-mke2fs = "true"
        extraargs = "-m 0"
    }
    size = "512M"
    mountpoint = "/userdata"
}

image batocera.img {
    hdimage {
        partition-table-type = "gpt"
    }

    # the partition name ("uboot") is the GPT label the SPL looks for
    partition uboot {
        partition-type-uuid = L
        image = "uboot.img"
        offset = 1M
        size = 16M
    }

    partition vfat {
        partition-type-uuid = U
        image = "boot.vfat"
        bootable = true
    }

    partition userdata {
        partition-type-uuid = L
        image = "userdata.ext4"
    }
}
